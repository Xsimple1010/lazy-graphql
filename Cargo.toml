[package]
name = "subgraph_common"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "net",
    "tokio-macros",
    "tracing",
    "test-util",
] }
tower-http = { version = "0.7.1", features = ["cors"] }
async-trait = "0.1.92"
dotenv = "0.15.0"
rdkafka = "0.39.0"
sea-orm = "2.0.4"
serde_json = "1.0.154"
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
tokio-cron-scheduler = "0.15.1"
serde = { version = "1.0.229", features = ["derive"] }
dashmap = "7.0.0-rc2"
tokio-stream = "0.1.19"
uuid = { version = "1.29.2", features = ["v7"] }
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
aws-s3-manager = { git = "https://github.com/Xsimple1010/aws-s3-manager.git" }
reqwest = "0.13.5"
google-firebase = { path = "../google-firebase" }
